name: Deploy SAM application

# Builds and uploads a service's SAM application to the deployment pipeline's
# artifact bucket. Service/environment specific secrets are resolved by name:
#   <ENVIRONMENT>_<SECRET-PREFIX>_<SUFFIX>, e.g. BUILD_STS_MOCK_GH_ACTIONS_ROLE_ARN
# Callers must pass `secrets: inherit`.

on:
  workflow_call:
    inputs:
      service:
        description: Service name, e.g. sts-mock
        required: true
        type: string
      working-directory:
        required: true
        type: string
      secret-prefix:
        description: Service part of the secret names, e.g. STS_MOCK
        required: true
        type: string
      environment:
        description: Environment part of the secret names, e.g. BUILD or DEV
        required: true
        type: string
      sam-version:
        required: true
        type: string
      sam-build-args:
        required: false
        type: string
        default: ''
      git-ref:
        description: Branch, tag or commit SHA to deploy. Defaults to the triggering ref.
        required: false
        type: string
        default: ''
      node:
        description: Set up Node.js before building
        required: false
        type: boolean
        default: false
      container:
        description: Build and push a container image to ECR, and reference it in the SAM template
        required: false
        type: boolean
        default: false
      sign-container:
        description: Sign the container image with Cosign (only applies when container is true)
        required: false
        type: boolean
        default: false
      sign-sam-artifact:
        description: Sign the SAM artifact using the service's signing profile
        required: false
        type: boolean
        default: false
      upload-method:
        description: 'devplatform-action or aws-cli'
        required: false
        type: string
        default: devplatform-action
      timeout-minutes:
        required: false
        type: number
        default: 15

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Runs for the same service and environment are serialised. Build deployments
    # supersede older ones; dev deployments queue so that none is cut short.
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ inputs.service }}
      cancel-in-progress: ${{ inputs.environment == 'BUILD' }}
    permissions:
      id-token: write
      contents: read
    env:
      SAM_CLI_TELEMETRY: 0
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the repository at the specific branch, tag, or commit
          ref: ${{ inputs.git-ref }}

      - name: Set up Node.js
        if: ${{ inputs.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets[format('{0}_{1}_GH_ACTIONS_ROLE_ARN', inputs.environment, inputs.secret-prefix)] }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        if: ${{ inputs.container }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Install Cosign
        if: ${{ inputs.container && inputs.sign-container }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.0.5'

      - name: Set GIT_REF_SHA
        # Set GIT_REF_SHA to the checked-out commit SHA
        run: echo "GIT_REF_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build, tag and push image to ECR
        if: ${{ inputs.container }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets[format('{0}_{1}_ECR_REPOSITORY_NAME', inputs.environment, inputs.secret-prefix)] }}
          IMAGE_TAG: ${{ env.GIT_REF_SHA }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Sign image with Cosign
        if: ${{ inputs.container && inputs.sign-container }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets[format('{0}_{1}_ECR_REPOSITORY_NAME', inputs.environment, inputs.secret-prefix)] }}
          CONTAINER_SIGN_KMS_KEY: ${{ secrets[format('{0}_{1}_CONTAINER_SIGNER_KMS_KEY_ARN', inputs.environment, inputs.secret-prefix)] }}
          IMAGE_TAG: ${{ env.GIT_REF_SHA }}
        run: cosign sign --key "awskms:///${CONTAINER_SIGN_KMS_KEY}" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: ${{ inputs.sam-version }}
          use-installer: true

      - name: Update SAM template with ECR image
        if: ${{ inputs.container }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets[format('{0}_{1}_ECR_REPOSITORY_NAME', inputs.environment, inputs.secret-prefix)] }}
          IMAGE_TAG: ${{ env.GIT_REF_SHA }}
        run: sed -i "s|CONTAINER-IMAGE-PLACEHOLDER|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|" template.yaml

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM template
        env:
          SAM_BUILD_ARGS: ${{ inputs.sam-build-args }}
        # SAM_BUILD_ARGS is intentionally unquoted so that multiple flags are word-split
        run: |
          # shellcheck disable=SC2086
          sam build $SAM_BUILD_ARGS

      - name: Upload SAM artifacts
        if: ${{ inputs.upload-method == 'devplatform-action' && !inputs.sign-sam-artifact }}
        # Upload the built SAM application artifacts to the deployment pipeline S3 bucket
        uses: govuk-one-login/devplatform-upload-action@6677f824e2e0899e207870cfc8224858d1dd6fac # v4.4.1
        with:
          artifact-bucket-name: ${{ secrets[format('{0}_{1}_GH_ARTIFACT_SOURCE_BUCKET_NAME', inputs.environment, inputs.secret-prefix)] }}
          working-directory: ${{ inputs.working-directory }}
          template-file: .aws-sam/build/template.yaml

      - name: Upload signed SAM artifacts
        if: ${{ inputs.upload-method == 'devplatform-action' && inputs.sign-sam-artifact }}
        # Upload the built and signed SAM application artifacts to the deployment pipeline S3 bucket
        uses: govuk-one-login/devplatform-upload-action@6677f824e2e0899e207870cfc8224858d1dd6fac # v4.4.1
        with:
          artifact-bucket-name: ${{ secrets[format('{0}_{1}_GH_ARTIFACT_SOURCE_BUCKET_NAME', inputs.environment, inputs.secret-prefix)] }}
          signing-profile-name: ${{ secrets[format('{0}_{1}_SIGNING_PROFILE_NAME', inputs.environment, inputs.secret-prefix)] }}
          working-directory: ${{ inputs.working-directory }}
          template-file: .aws-sam/build/template.yaml

      - name: Zip SAM template
        if: ${{ inputs.upload-method == 'aws-cli' }}
        run: |
          mv .aws-sam/build/template.yaml cf-template.yaml
          zip template.zip cf-template.yaml

      - name: Upload SAM template with AWS CLI
        if: ${{ inputs.upload-method == 'aws-cli' }}
        env:
          ARTIFACT_BUCKET_NAME: ${{ secrets[format('{0}_{1}_GH_ARTIFACT_SOURCE_BUCKET_NAME', inputs.environment, inputs.secret-prefix)] }}
          IMAGE_TAG: ${{ env.GIT_REF_SHA }}
        run: |
          aws s3 cp template.zip "s3://$ARTIFACT_BUCKET_NAME/template.zip" --metadata "repository=$GITHUB_REPOSITORY,commitsha=$IMAGE_TAG"
