name: Node.js CI

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      run-lint:
        description: Run the formatting check and linter
        required: false
        type: boolean
        default: true
      run-sonar:
        description: Run the SonarQube scan and quality gate
        required: false
        type: boolean
        default: true
      quality-gate-timeout-minutes:
        required: false
        type: number
        default: 15
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  node-ci:
    name: Node.js CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        if: ${{ inputs.run-lint }}
        run: npm run format:check

      - name: Run the linter
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: SonarQube Scan
        if: ${{ inputs.run-sonar }}
        uses: sonarsource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check SonarQube quality gate
        if: ${{ inputs.run-sonar }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: ${{ inputs.quality-gate-timeout-minutes }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: ${{ inputs.working-directory }}/.scannerwork/report-task.txt
