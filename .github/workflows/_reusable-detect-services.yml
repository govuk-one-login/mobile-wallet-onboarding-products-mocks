name: Detect services

# Works out which services (see .github/config/services.json) a run applies to:
#  - pull_request / push: services with changed files (shared workflow changes select all services)
#  - workflow_dispatch:   the selected service, or all services
#  - schedule:            all services

on:
  workflow_call:
    inputs:
      selected-service:
        description: Service name or "all". Only used for workflow_dispatch and schedule runs.
        required: false
        type: string
        default: all
    outputs:
      services:
        description: JSON array of config objects for the selected services
        value: ${{ jobs.detect-services.outputs.services }}
      names:
        description: JSON array of the selected service names
        value: ${{ jobs.detect-services.outputs.names }}
      node-services:
        description: Selected services that are Node.js projects
        value: ${{ jobs.detect-services.outputs.node-services }}
      container-services:
        description: Selected services that build a container image
        value: ${{ jobs.detect-services.outputs.container-services }}
      oas-drift-services:
        description: Selected services that have an upstream OpenAPI spec to check for drift
        value: ${{ jobs.detect-services.outputs.oas-drift-services }}

jobs:
  detect-services:
    name: Detect services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      services: ${{ steps.detect.outputs.services }}
      names: ${{ steps.detect.outputs.names }}
      node-services: ${{ steps.detect.outputs.node-services }}
      container-services: ${{ steps.detect.outputs.container-services }}
      oas-drift-services: ${{ steps.detect.outputs.oas-drift-services }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect services
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SELECTED_SERVICE: ${{ inputs.selected-service }}
        run: .github/scripts/detect-services.sh
