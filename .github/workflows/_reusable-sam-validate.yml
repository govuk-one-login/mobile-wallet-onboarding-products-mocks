name: Validate and build SAM template

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      sam-version:
        required: true
        type: string
      sam-build-args:
        required: false
        type: string
        default: ''

jobs:
  validate-and-build-sam-template:
    name: Validate and build SAM template
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SAM_CLI_TELEMETRY: 0
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: ${{ inputs.sam-version }}
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM template
        env:
          SAM_BUILD_ARGS: ${{ inputs.sam-build-args }}
        # SAM_BUILD_ARGS is intentionally unquoted so that multiple flags are word-split
        run: |
          # shellcheck disable=SC2086
          sam build $SAM_BUILD_ARGS
