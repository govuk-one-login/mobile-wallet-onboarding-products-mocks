name: Push to Main

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to build and upload
        required: true
        type: choice
        default: all
        options:
          - all
          - sts-mock
          - status-list-mock
          - txma-mock
  push:
    branches: [ main ]
    paths:
      - sts-mock/**
      - status-list-mock/**
      - txma-mock/**
      - .github/workflows/push-to-main.yml
      - .github/workflows/_reusable-*.yml
      - .github/config/services.json
      - .github/scripts/detect-services.sh

permissions:
  contents: read

jobs:
  detect-services:
    name: Detect services
    uses: ./.github/workflows/_reusable-detect-services.yml
    with:
      selected-service: ${{ inputs.service || 'all' }}

  check-sam-template-formatting:
    name: Check SAM template formatting (${{ matrix.service.name }})
    needs: [detect-services]
    if: needs.detect-services.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}
    uses: ./.github/workflows/_reusable-sam-format-check.yml
    with:
      working-directory: ./${{ matrix.service.directory }}

  run-checkov:
    name: Run Checkov (${{ matrix.service.name }})
    needs: [detect-services]
    if: needs.detect-services.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}
    uses: ./.github/workflows/_reusable-checkov.yml
    with:
      file-to-scan: ${{ matrix.service.directory }}/template.yaml

  validate-docker-image:
    name: Validate Docker image (${{ matrix.service.name }})
    needs: [detect-services]
    if: needs.detect-services.outputs.container-services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.container-services) }}
    uses: ./.github/workflows/_reusable-docker-validate.yml
    with:
      working-directory: ./${{ matrix.service.directory }}

  node-ci:
    name: Node.js CI (${{ matrix.service.name }})
    needs: [detect-services]
    if: needs.detect-services.outputs.node-services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.node-services) }}
    uses: ./.github/workflows/_reusable-node-ci.yml
    with:
      working-directory: ${{ matrix.service.directory }}
      run-lint: false
      run-sonar: true
      quality-gate-timeout-minutes: 15
    secrets: inherit

  deploy:
    name: Deploy (${{ matrix.service.name }})
    needs: [detect-services, validate-docker-image, node-ci]
    # The validation jobs above may be skipped when no selected service needs them
    if: >-
      !cancelled() &&
      needs.detect-services.result == 'success' &&
      needs.detect-services.outputs.services != '[]' &&
      needs.validate-docker-image.result != 'failure' &&
      needs.node-ci.result != 'failure'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}
    uses: ./.github/workflows/_reusable-sam-deploy.yml
    with:
      service: ${{ matrix.service.name }}
      working-directory: ${{ matrix.service.directory }}
      secret-prefix: ${{ matrix.service.secret-prefix }}
      environment: BUILD
      sam-version: ${{ matrix.service.sam-version }}
      sam-build-args: ${{ matrix.service.sam-build-args }}
      node: ${{ matrix.service.node }}
      container: ${{ matrix.service.container }}
      sign-container: true
      sign-sam-artifact: ${{ matrix.service.sign-sam-artifact-build }}
      upload-method: devplatform-action
      timeout-minutes: ${{ matrix.service.deploy-timeout-minutes }}
    secrets: inherit
